<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cashlytics-brand" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cashlytics-bars" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#bef264" />
    </linearGradient>
    <filter id="cashlytics-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22c55e" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#cashlytics-glow)">
    <!-- Stylized 'C' shape -->
    <path
      d="M 64 24
         L 44 24
         C 30 24 20 34 20 49
         C 20 63 30 73 45 73
         C 53 73 60 70 65 65
         C 63 60 55 64 45 64
         C 36 64 29 58 29 49
         C 29 40 36 33 45 33
         L 64 33
         C 66 33 67 31 67 28.5
         C 67 26 66 24 64 24 Z"
      fill="url(#cashlytics-brand)"
    />

    <!-- Growth Analytics Bars -->
    <rect x="42" y="47" width="7" height="19" rx="2" fill="url(#cashlytics-bars)" />
    <rect x="52" y="38" width="7" height="28" rx="2" fill="url(#cashlytics-bars)" />
    <rect x="62" y="29" width="7" height="37" rx="2" fill="url(#cashlytics-bars)" />

    <!-- Orbital Trajectory Swoosh -->
    <path
      d="M 23 72
         C 33 84 57 86 78 69
         C 81 66.5 82 64.5 79.5 65
         C 62 78 40 78 28 69
         C 25 66.8 21.5 69.5 23 72 Z"
      fill="url(#cashlytics-brand)"
    />
  </g>
</svg>
